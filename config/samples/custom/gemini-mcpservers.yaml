# Custom MCP Server Registry entries based on actual Gemini CLI setup
# Apply with: kubectl apply -f config/samples/custom/gemini-mcpservers.yaml
---
apiVersion: agentregistry.dev/v1alpha1
kind: MCPServerCatalog
metadata:
  name: genkit-server-prod-v1.28.0
  namespace: agentregistry
  labels:
    environment: prod
    agentregistry.dev/resource-name: genkit-mcp-server
    agentregistry.dev/resource-version: "1.28.0"
    agentregistry.dev/resource-environment: prod
    agentregistry.dev/resource-source: manual
spec:
  name: genkit-mcp-server
  version: "1.28.0"
  title: "Genkit MCP Server"
  description: "Firebase Genkit AI framework integration — provides flow execution, runtime management, and documentation lookup for building AI features with Genkit."
  websiteUrl: https://firebase.google.com/docs/genkit
  repository:
    url: https://github.com/firebase/genkit
    source: github
  packages:
    - identifier: "genkit-cli"
      registryType: npm
      version: "^1.28.0"
      transport:
        type: stdio
  _meta:
    io.modelcontextprotocol.registry/publisher-provided:
      aregistry.ai/metadata:
        identity:
          org_is_verified: true
          publisher_identity_verified_by_jwt: true
---
apiVersion: agentregistry.dev/v1alpha1
kind: MCPServerCatalog
metadata:
  name: linear-server-prod-v1.0.0
  namespace: agentregistry
  labels:
    environment: prod
    agentregistry.dev/resource-name: linear-mcp-server
    agentregistry.dev/resource-version: "1.0.0"
    agentregistry.dev/resource-environment: prod
    agentregistry.dev/resource-source: manual
spec:
  name: linear-mcp-server
  version: "1.0.0"
  title: "Linear MCP Server"
  description: "Linear project management integration — create/update issues, manage projects, track cycles, and sync status updates directly from AI agents."
  websiteUrl: https://linear.app
  remotes:
    - type: streamable-http
      url: https://mcp.linear.app/sse
  _meta:
    io.modelcontextprotocol.registry/publisher-provided:
      aregistry.ai/metadata:
        identity:
          org_is_verified: true
          publisher_identity_verified_by_jwt: true
---
